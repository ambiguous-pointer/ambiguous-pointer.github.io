<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人简历</title>
    <style>
        /* 基础重置与排版 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #f4f4f4;
            color: #000;
            font-size: 13px;
            line-height: 1.5;
            padding: 20px;
        }

        .container {
            width: 1000px;
            margin: 0 auto;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding-bottom: 30px;
        }

        /* 顶部 Header */
        .header {
            background-color: #7b94b5;
            /* 类似图片中的蓝灰色 */
            color: #fff;
            padding: 20px 30px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100px;
        }

        .header h1 {
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .header .intent {
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .avatar-placeholder {
            position: absolute;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #e0f2f1 0%, #81c784 100%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            /* 类似图片中的不规则圆形 */
        }

        /* 基本信息 */
        .basic-info {
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
        }

        .basic-info div {
            flex: 1;
        }

        /* 模块标题 */
        .section-title {
            background-color: #dfe6f0;
            color: #43699d;
            font-size: 16px;
            font-weight: bold;
            padding: 5px 15px;
            margin: 0 15px 10px 15px;
            border-radius: 2px;
        }

        /* 内容区块通用边距 */
        .section-content {
            padding: 0 30px;
            margin-bottom: 15px;
        }

        /* 教育背景 */
        .education {
            display: flex;
            font-weight: bold;
            font-size: 14px;
        }

        .education div {
            margin-right: 40px;
        }

        /* 专业技能 */
        .skills-text {
            text-align: justify;
            margin-bottom: 5px;
        }

        /* 证书和奖项区 (网格布局) */
        .cert-grid {
            display: grid;
            grid-template-columns: 2.5fr 3.5fr 2fr 1fr;
            gap: 15px;
        }

        .cert-col h3 {
            font-size: 14px;
            margin-bottom: 5px;
        }

        ul {
            list-style-type: disc;
            padding-left: 15px;
        }

        li {
            margin-bottom: 3px;
        }

        /* 工作和项目经历 */
        .job-card {
            border: 1px dotted #333;
            margin: 0 15px 15px 15px;
            padding: 10px;
        }

        .job-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 14px;
            border-bottom: 1px dashed #999;
            padding-bottom: 5px;
            margin-bottom: 10px;
        }

        /* 针对普通项目布局的网格 */
        .project-grid {
            display: grid;
            grid-template-columns: 10% 20% 25% 45%;
            gap: 10px;
        }

        .project-grid-headers {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .project-row {
            padding: 10px 0;
            border-bottom: 1px dashed #ccc;
        }

        .project-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .proj-name {
            display: flex;
            align-items: center;
        }

        .tech-stack {
            font-size: 12px;
            margin-bottom: 5px;
        }

        /* 针对最后一个经历的 5 列网格布局 */
        .five-col-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
        }

        .five-col-grid h4 {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 13px;
        }

        /* 自我评价 */
        .self-eval p {
            text-indent: 2em;
            margin-bottom: 5px;
            text-align: justify;
        }

        /* 页脚 */
        .footer {
            text-align: right;
            padding: 0 30px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>

<body>

        <!-- 内容将由JS动态生成注入到这里 -->

        // ==========================================
        // 2. 渲染逻辑 (JavaScript)
        // 根据 JSON 数据自动生成 HTML 结构
        // ==========================================
        function renderResume() {
            const app = document.getElementById('app');

            // --- Header 生成 ---
            let html = `
            <div class="header">
                <h1>${resumeData.header.title}</h1>
                <div class="intent">${resumeData.header.intentions}</div>
                <div class="avatar-placeholder"></div>
            </div>
        `;

            // --- 基本信息 生成 ---
            html += `<div class="basic-info">`;
            html += `<div>${resumeData.basicInfo[0].label}${resumeData.basicInfo[0].value}</div>`;
            html += `<div>${resumeData.basicInfo[1].label}${resumeData.basicInfo[1].value}</div>`;
            html += `</div><div class="basic-info" style="padding-top:0;">`;
            html += `<div>${resumeData.basicInfo[2].label}${resumeData.basicInfo[2].value}</div>`;
            html += `<div>${resumeData.basicInfo[3].label}${resumeData.basicInfo[3].value}</div>`;
            html += `</div>`;

            // --- 教育背景 生成 ---
            html += `<div class="section-title">教育背景</div>`;
            html += `
            <div class="section-content education">
                <div>${resumeData.education.school}</div>
                <div>${resumeData.education.major}</div>
                <div>${resumeData.education.gpa}</div>
                <div>${resumeData.education.rank}</div>
            </div>
        `;

            // --- 专业技能 生成 ---
            html += `<div class="section-title">专业技能</div>`;
            html += `<div class="section-content">`;
            resumeData.skills.forEach(skill => {
                html += `<p class="skills-text">${skill}</p>`;
            });
            html += `</div>`;

            // --- 技能证书和获奖证书 生成 ---
            html += `<div class="section-title">技能证书和获奖证书</div>`;
            html += `<div class="section-content cert-grid">`;
            resumeData.certificates.forEach(cert => {
                html += `<div class="cert-col">
                        <h3>${cert.title}</h3>
                        <ul>
                            ${cert.items.map(item => `<li>${item}</li>`).join('')}
                        </ul>
                     </div>`;
            });
            html += `</div>`;

            // --- 工作和项目经历 生成 ---
            html += `<div class="section-title">工作和项目经历</div>`;

            resumeData.workExperience.forEach(job => {
                html += `<div class="job-card">
                        <div class="job-header">
                            <div>${job.date}</div>
                            <div>${job.company}</div>
                            <div>${job.role}</div>
                        </div>`;

                // 依据布局类型渲染不同样式的项目表
                if (job.layout === 'standard') {
                    html += `<div class="project-grid project-grid-headers">
                            <div>项目名称：</div>
                            <div>主要职责：</div>
                            <div>项目关键点：</div>
                            <div>解决方案：</div>
                         </div>`;

                    job.projects.forEach(proj => {
                        html += `
                        <div class="project-grid project-row">
                            <div class="proj-name"><ul><li>${proj.name}</li></ul></div>
                            <div>
                                <ul>${proj.responsibilities.map(r => `<li>${r}</li>`).join('')}</ul>
                            </div>
                            <div>
                                <ul>${proj.keyPoints.map(k => `<li>${k}</li>`).join('')}</ul>
                            </div>
                            <div>
                                ${proj.techStack ? `<div class="tech-stack">${proj.techStack}</div>` : ''}
                                <ul>${proj.solutions.map(s => `<li>${s}</li>`).join('')}</ul>
                            </div>
                        </div>
                    `;
                    });
                } else if (job.layout === 'grid') {
                    html += `<div class="five-col-grid">`;
                    job.columns.forEach(col => {
                        html += `<div>
                                <h4>${col.title}</h4>
                                <ul>${col.items.map(item => `<li>${item}</li>`).join('')}</ul>
                             </div>`;
                    });
                    html += `</div>`;
                }
                html += `</div>`;
            });

            // --- 自我评价和突出点 生成 ---
            html += `<div class="section-title">自我评价和突出点</div>`;
            html += `<div class="section-content self-eval">`;
            resumeData.selfEvaluation.forEach(para => {
                html += `<p>${para}</p>`;
            });
            html += `</div>`;

            html += `<div class="footer">第1页/共1页</div>`;

            // 将生成的 HTML 注入到容器中
            app.innerHTML = html;
        }

        // 执行渲染
        renderResume();
    </script>

</body>

</html>
